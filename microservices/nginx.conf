events {
    worker_connections 1024;
}

http {
    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # Disable response buffer to prevent any streaming delay (optional)
        proxy_buffering off;

        # 1. Specific Wallet rules (higher priority to avoid general Client rule matching)
        location ~* /v\d+/client/walletcards/ {
            proxy_pass http://wallet-service:3003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. General Wallet rules
        location ~* /(balances|transfers|recharge|walletcards|movements) {
            proxy_pass http://wallet-service:3003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Device Service rules
        location ~* /(device-identify|device-auth|device) {
            proxy_pass http://device-service:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Customer Service rules (register, client, profile, otp, document extensions, etc.)
        location ~* /(document-extensions|users-validate|otp-generate|face-recognition|users-create|reference/register|sign-in|parameters|register|client|profile) {
            proxy_pass http://customer-service:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Default Fallback
        location / {
            add_header Content-Type application/json;
            return 404 '{"state": -4, "message": "Gateway local: Ruta no encontrada", "code": "GATEWAY_NOT_FOUND"}';
        }
    }
}
